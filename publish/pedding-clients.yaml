apiVersion: apps/v1
kind: Deployment
metadata:
  name: pedding-clients
  namespace: viptech
  labels:
    app: pedding-clients
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pedding-clients
  template:
    metadata:
      labels:
        app: pedding-clients
    spec:
      containers:
        - name: pedding-clients
          image: juca266/pedding-clients:latest
          ports:
            - containerPort: 4000
          env:
            - name: TZ
              value: America/Sao_Paulo
          volumeMounts:
            - name: tz-config
              mountPath: /etc/localtime
              readOnly: true
      volumes:
        - name: tz-config
          hostPath:
            path: /etc/localtime